<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Volt wordmark">
  <defs>
    <linearGradient id="wmBolt" x1="60" y1="60" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38E1FF"/>
      <stop offset="0.55" stop-color="#1E7BFF"/>
      <stop offset="1" stop-color="#0B3FA8"/>
    </linearGradient>
    <linearGradient id="wmText" x1="240" y1="80" x2="860" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#9FC2FF"/>
    </linearGradient>
  </defs>

  <!-- Lightning-bolt mark -->
  <g transform="translate(0,0)">
    <path d="M150 44
             L104 44
             L172 168
             L126 168
             L150 236
             L210 132
             L164 132
             Z" fill="url(#wmBolt)"/>
  </g>

  <!-- Wordmark -->
  <text x="248" y="190"
        font-family="'Space Grotesk','Segoe UI',Inter,system-ui,sans-serif"
        font-size="170" font-weight="700" letter-spacing="-4"
        fill="url(#wmText)">volt</text>
</svg>
