<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Volt logo">
  <defs>
    <linearGradient id="voltBolt" x1="160" y1="96" x2="352" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38E1FF"/>
      <stop offset="0.55" stop-color="#1E7BFF"/>
      <stop offset="1" stop-color="#0B3FA8"/>
    </linearGradient>
    <linearGradient id="voltBg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#11161F"/>
      <stop offset="1" stop-color="#0A0D14"/>
    </linearGradient>
    <filter id="voltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded dark tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#voltBg)" stroke="#1F2A3A" stroke-width="2"/>

  <!-- Lightning-bolt "V" -->
  <g filter="url(#voltGlow)">
    <path d="M196 104
             L150 104
             L236 300
             L256 300
             L222 104
             Z" fill="url(#voltBolt)"/>
    <path d="M316 104
             L362 104
             L276 300
             L256 300
             L290 104
             Z" fill="url(#voltBolt)" opacity="0.92"/>
    <path d="M236 288
             L300 288
             L246 416
             L226 372
             L268 320
             L222 320
             Z" fill="url(#voltBolt)"/>
  </g>
</svg>
