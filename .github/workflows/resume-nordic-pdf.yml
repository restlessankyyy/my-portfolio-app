name: 📸 Resume PDF (Nordic — With Photo)

on:
  push:
    paths:
      - 'scripts/resume-photo.html'
      - 'scripts/generate-pdf-photo.js'
      - 'public/img/ankit.png'
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-nordic-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Profile-Nordic.pdf
        run: node scripts/generate-pdf-photo.js

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v5
        with:
          name: Profile-Nordic
          path: public/assets/Profile-Nordic.pdf
          retention-days: 90

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet public/assets/Profile-Nordic.pdf 2>/dev/null && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit & push updated PDF
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/Profile-Nordic.pdf
          git commit -m "chore: auto-regenerate Profile-Nordic.pdf [skip ci]"
          git pull --rebase origin main
          git push
