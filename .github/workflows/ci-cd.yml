# ============================================================================
# Production-Ready CI/CD Pipeline for Portfolio
# ============================================================================
# This pipeline implements enterprise-grade best practices:
# - Multi-stage builds with caching
# - Security scanning (SAST, dependency audit, secrets detection)
# - Infrastructure as Code validation
# - Blue/Green deployment capability
# - Automated rollback on failure
# - Comprehensive testing and validation
# - Deployment notifications
# - Performance monitoring
# ============================================================================

name: 🚀 CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/CICD.md'
  
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/CICD.md'
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      deploy_type:
        description: 'Deployment type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - lambda-only
          - infrastructure-only
      skip_tests:
        description: 'Skip tests (emergency only)'
        required: false
        default: false
        type: boolean

# Prevent concurrent deployments to same environment.
# Cancel superseded runs on pull requests (cheap), but never cancel
# in-progress deployments on main / manual dispatch (avoids half-applied infra).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # AWS Configuration
  AWS_REGION: eu-north-1
  
  # Build Configuration
  NODE_VERSION: '24'
  TERRAFORM_VERSION: '1.5.0'
  
  # Application Configuration
  LAMBDA_FUNCTION_NAME: portfolio-ankit-prod-7ette088
  DOMAIN_NAME: ankitraj.cloud
  
  # Cache Configuration
  CACHE_VERSION: v1

permissions:
  contents: read
  pull-requests: write
  id-token: write
  security-events: write

jobs:
  # ============================================================================
  # Stage 1: Code Quality & Security Analysis
  # ============================================================================
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    outputs:
      lint_status: ${{ steps.lint.outcome }}
      security_status: ${{ steps.security.outcome }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎨 ESLint Analysis
        id: lint
        run: |
          npm run lint -- --format=json --output-file=eslint-report.json || true
          npm run lint || echo "::warning::Linting issues found"
        continue-on-error: true

      - name: 💅 Prettier Check
        run: |
          npx prettier --check "public/**/*.{js,css,html}" || echo "::warning::Formatting issues found"
        continue-on-error: true

      - name: 🔒 Security Audit
        id: security
        run: |
          npm audit --audit-level=high --json > audit-report.json || true
          npm audit --audit-level=critical || echo "::warning::Security vulnerabilities found"
        continue-on-error: true

      - name: 📊 Upload Code Quality Reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: code-quality-reports
          path: |
            eslint-report.json
            audit-report.json
          retention-days: 7

  # ============================================================================
  # Stage 2: Security Scanning (SAST)
  # ============================================================================
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      # Secret detection is handled by GitHub-native Secret Scanning +
      # Push Protection (repo Settings > Code security), not a third-party
      # action. Push Protection blocks secrets at push time (before they
      # ever reach the remote), and Secret Scanning continuously scans the
      # full history. This is strictly stronger than a CI-time scan and
      # keeps the toolchain first-party.

      # GitHub-native dependency vulnerability scanning (GitHub Advisory Database).
      # Runs on PRs by diffing the dependency graph; blocks when a HIGH/CRITICAL
      # vulnerable dependency is introduced. Continuous coverage on main is
      # handled by Dependabot alerts (.github/dependabot.yml), code SAST by
      # CodeQL (codeql.yml), and npm audit in the code-quality job.
      - name: 🔎 Dependency Review (GitHub Advisory DB)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ============================================================================
  # Stage 3: Unit & Integration Tests
  # ============================================================================
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    # Runs in parallel with code-quality and security-scan — tests do not
    # depend on lint/format results, so gating them serially only slows CI.
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Tests
        run: npm test
        env:
          NODE_ENV: test

      - name: 🏃 Start Server & Health Check
        run: |
          npm start &
          sleep 5
          curl -f http://localhost:3000/health || exit 1
          kill %1

  # ============================================================================
  # Stage 4: Infrastructure Validation
  # ============================================================================
  terraform-validate:
    name: 🏗️ Terraform Validation
    runs-on: ubuntu-latest
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Build Lambda Package (for validation)
        run: |
          chmod +x scripts/build-lambda.sh
          ./scripts/build-lambda.sh

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Keyless auth via GitHub OIDC: assumes an IAM role short-term (no
      # long-lived AWS keys in repo secrets). Requires the top-level
      # `id-token: write` permission and the IAM role + OIDC provider from
      # terraform/github-oidc/. Set the AWS_ROLE_ARN repo secret to the role ARN.
      - name: 🔑 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-tf-validate-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ♻️ Cache Terraform Providers
        uses: actions/cache@v6
        with:
          path: |
            terraform/.terraform
            terraform/cloudflare/.terraform
          key: terraform-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl', 'terraform/cloudflare/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: 📋 Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: terraform
        continue-on-error: true

      - name: 🔧 Terraform Init
        id: init
        run: terraform init -input=false
        working-directory: terraform

      - name: ✅ Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: terraform

      - name: 📊 Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false -out=tfplan \
            -detailed-exitcode 2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          echo "exitcode=$code" >> $GITHUB_OUTPUT
          # detailed-exitcode: 0 = no changes, 2 = changes present, 1 = error.
          # Fail fast on a genuine planning error so an incomplete plan is never
          # uploaded as an artifact and applied by the deploy job.
          if [ "$code" -eq 1 ]; then
            echo "::error::Terraform plan failed (exit code 1); not uploading an incomplete plan."
            exit 1
          fi
          exit 0
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      - name: ☁️ Cloudflare Terraform Init
        id: cf_init
        run: terraform init -input=false
        working-directory: terraform/cloudflare

      - name: ☁️ Cloudflare Terraform Validate
        id: cf_validate
        run: terraform validate -no-color
        working-directory: terraform/cloudflare

      - name: ☁️ Cloudflare Terraform Plan
        id: cf_plan
        run: |
          terraform plan -no-color -input=false 2>&1 | tee cf-plan.txt
        working-directory: terraform/cloudflare
        continue-on-error: true
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_custom_domain_target: "d-hctzaliyt6.execute-api.eu-north-1.amazonaws.com"
          # Use the live profile custom-domain target (the AWS stack always
          # provisions profile.ankitraj.cloud) so the plan preview matches what
          # apply does. Passing "" here made count=0 and showed a phantom
          # destroy of cloudflare_record.profile on every plan.
          TF_VAR_profile_domain_target: "d-892wmteha9.execute-api.eu-north-1.amazonaws.com"
          TF_VAR_ci_probe_secret: ${{ secrets.CF_PROBE_SECRET }}

      - name: 📤 Upload Terraform Plan
        uses: actions/upload-artifact@v5
        with:
          name: terraform-plan
          path: |
            terraform/tfplan
            terraform/plan.txt
            terraform/cloudflare/cf-plan.txt
          retention-days: 7

      - name: 💬 PR Comment - Terraform Plan
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- terraform-plan-comment -->';
            const MAX = 60000;

            // Read a plan file safely (it may not exist if an earlier step failed).
            const readPlan = (p) => {
              try { return fs.readFileSync(p, 'utf8'); }
              catch { return ''; }
            };
            const awsPlan = readPlan('terraform/plan.txt');
            const cfPlan = readPlan('terraform/cloudflare/cf-plan.txt');

            // Map a step outcome to a status icon + label.
            const icon = (o) => o === 'success'
              ? '✅ Passed'
              : o === 'failure'
                ? '❌ Failed'
                : o === 'skipped'
                  ? '⏭️ Skipped'
                  : `⚠️ ${o}`;

            // Derive a one-line verdict from raw plan output.
            const verdict = (text, label) => {
              if (!text) return `⚪ **${label}:** plan not available`;
              if (/No changes\./.test(text)) {
                return `🟢 **${label}:** no changes, infrastructure is up to date`;
              }
              const m = text.match(/Plan:\s+(\d+) to add,\s+(\d+) to change,\s+(\d+) to destroy/);
              if (m) {
                const [, add, chg, del] = m;
                return `🟡 **${label}:** \`+${add}\` to add, \`~${chg}\` to change, \`-${del}\` to destroy`;
              }
              if (/Error:/.test(text)) return `🔴 **${label}:** plan failed, see details below`;
              return `🔵 **${label}:** review plan below`;
            };

            // Parse the raw plan into a per-resource change list so reviewers
            // can see exactly what changes without expanding the raw output.
            const changeRows = (text, label) => {
              if (!text) return [];
              const re = /^\s*#\s+(.+?)\s+(?:will be|must be)\s+(created|destroyed|replaced|updated in-place)/gm;
              const rows = [];
              let m;
              while ((m = re.exec(text)) !== null) {
                const action = m[2];
                const sym = action === 'created' ? '🟢 create'
                  : action === 'destroyed' ? '🔴 destroy'
                  : action === 'replaced' ? '🟠 replace'
                  : '🟡 update';
                rows.push(`| ${label} | \`${m[1]}\` | ${sym} |`);
              }
              return rows;
            };

            const changeTable = () => {
              const rows = [...changeRows(awsPlan, 'AWS'), ...changeRows(cfPlan, 'Cloudflare')];
              if (!rows.length) {
                return ['_No resource changes planned. Both providers match their configuration._'];
              }
              return [
                '### 📋 Planned resource changes',
                '',
                '| Provider | Resource | Action |',
                '| :--- | :--- | :---: |',
                ...rows,
              ];
            };

            const fmtBlock = (text) => {
              if (!text) return '_No plan output captured._';
              const body = text.length > MAX
                ? text.substring(0, MAX) + '\n\n... (output truncated)'
                : text;
              return '```terraform\n' + body + '\n```';
            };

            const sha = context.payload.pull_request
              ? context.payload.pull_request.head.sha.substring(0, 7)
              : context.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const output = [
              MARKER,
              '## 🏗️ Terraform Plan Summary',
              '',
              verdict(awsPlan, 'AWS'),
              '',
              verdict(cfPlan, 'Cloudflare'),
              '',
              '| Check | AWS | Cloudflare |',
              '| :--- | :---: | :---: |',
              `| Format | ${icon('${{ steps.fmt.outcome }}')} | n/a |`,
              `| Init | ${icon('${{ steps.init.outcome }}')} | ${icon('${{ steps.cf_init.outcome }}')} |`,
              `| Validate | ${icon('${{ steps.validate.outcome }}')} | ${icon('${{ steps.cf_validate.outcome }}')} |`,
              `| Plan | ${icon('${{ steps.plan.outcome }}')} | ${icon('${{ steps.cf_plan.outcome }}')} |`,
              '',
              ...changeTable(),
              '',
              '<details><summary>📄 AWS plan output</summary>',
              '',
              fmtBlock(awsPlan),
              '',
              '</details>',
              '',
              '<details><summary>☁️ Cloudflare plan output</summary>',
              '',
              fmtBlock(cfPlan),
              '',
              '</details>',
              '',
              '---',
              `<sub>Commit \`${sha}\` · triggered by @${context.actor} · [view workflow run](${runUrl})</sub>`,
            ].join('\n');

            // Upsert: update the existing bot comment in place instead of
            // posting a new one on every push (keeps the PR thread clean).
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: output,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output,
              });
            }

  # ============================================================================
  # Stage 5: Build Lambda Package
  # ============================================================================
  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    needs: [code-quality, test, terraform-validate]
    if: |
      always() &&
      (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.terraform-validate.result == 'success')
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
      package_size: ${{ steps.build.outputs.package_size }}
      build_hash: ${{ steps.build.outputs.build_hash }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Build Lambda Package
        id: build
        run: |
          chmod +x scripts/build-lambda.sh
          ./scripts/build-lambda.sh
          
          # Calculate hash for versioning
          BUILD_HASH=$(sha256sum terraform/portfolio-lambda.zip | cut -d ' ' -f1 | head -c 8)
          PACKAGE_SIZE=$(du -h terraform/portfolio-lambda.zip | cut -f1)
          ARTIFACT_NAME="lambda-${GITHUB_SHA::8}-${BUILD_HASH}"
          
          echo "build_hash=$BUILD_HASH" >> $GITHUB_OUTPUT
          echo "package_size=$PACKAGE_SIZE" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          
          echo "📦 Build completed:"
          echo "   Hash: $BUILD_HASH"
          echo "   Size: $PACKAGE_SIZE"
          echo "   Artifact: $ARTIFACT_NAME"

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: terraform/portfolio-lambda.zip
          retention-days: 7

      - name: 📊 Build Summary
        run: |
          echo "## 📦 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Package Size | ${{ steps.build.outputs.package_size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Hash | ${{ steps.build.outputs.build_hash }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${GITHUB_SHA::8} |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 6: Deploy to Production
  # ============================================================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [build, terraform-validate, security-scan]
    # Only deploy from main branch or manual workflow dispatch
    if: |
      always() &&
      needs.build.result == 'success' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://${{ env.DOMAIN_NAME }}
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
      api_url: ${{ steps.deploy.outputs.api_url }}
      previous_version: ${{ steps.backup.outputs.previous_version }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Keyless auth via GitHub OIDC (see terraform/github-oidc/). No static
      # AWS keys: a short-lived role session is minted per run.
      - name: 🔑 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📥 Download Build Artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: terraform/

      - name: 💾 Backup Current Version
        id: backup
        run: |
          # Get current Lambda version for rollback
          CURRENT_VERSION=$(aws lambda get-function \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --query 'Configuration.Version' \
            --output text 2>/dev/null || echo "NONE")

          echo "previous_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Download the currently-live code so we can truly restore it on failure
          CODE_URL=$(aws lambda get-function \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --query 'Code.Location' \
            --output text 2>/dev/null || echo "")
          if [ -n "$CODE_URL" ]; then
            curl -sf "$CODE_URL" -o /tmp/rollback.zip \
              && echo "📸 Saved rollback artifact ($(du -h /tmp/rollback.zip | cut -f1))" \
              || echo "⚠️ Could not save rollback artifact"
          fi
          echo "📸 Backed up current version: $CURRENT_VERSION"

      - name: 📥 Download Reviewed Terraform Plan
        if: github.event.inputs.deploy_type != 'lambda-only'
        uses: actions/download-artifact@v5
        with:
          name: terraform-plan
          path: terraform/
        continue-on-error: true

      - name: 🏗️ Deploy AWS Infrastructure
        if: github.event.inputs.deploy_type != 'lambda-only'
        run: |
          cd terraform
          terraform init -input=false
          # Apply the exact plan that was reviewed in terraform-validate.
          # Fall back to a fresh plan+apply if the artifact is unavailable.
          if [ -f tfplan ]; then
            echo "📋 Applying reviewed plan (tfplan)"
            terraform apply -input=false tfplan
          else
            echo "⚠️ No saved plan found; planning and applying fresh"
            terraform apply -auto-approve -input=false
          fi

          # Capture profile domain target for Cloudflare
          PROFILE_TARGET=$(terraform output -raw profile_domain_target 2>/dev/null || echo "")
          echo "PROFILE_DOMAIN_TARGET=$PROFILE_TARGET" >> $GITHUB_ENV
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      - name: ☁️ Deploy Cloudflare Infrastructure
        if: github.event.inputs.deploy_type != 'lambda-only'
        run: |
          cd terraform/cloudflare
          terraform init -input=false
          terraform apply -auto-approve -input=false
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_custom_domain_target: "d-hctzaliyt6.execute-api.eu-north-1.amazonaws.com"
          TF_VAR_profile_domain_target: ${{ env.PROFILE_DOMAIN_TARGET }}
          TF_VAR_ci_probe_secret: ${{ secrets.CF_PROBE_SECRET }}

      - name: 🚀 Deploy Lambda Function
        id: deploy
        if: github.event.inputs.deploy_type != 'infrastructure-only'
        run: |
          DEPLOYMENT_ID="deploy-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}"
          
          echo "🚀 Starting deployment: $DEPLOYMENT_ID"
          
          # Update Lambda function code
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://terraform/portfolio-lambda.zip \
            --publish
          
          # Wait for update to complete
          echo "⏳ Waiting for Lambda update..."
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }}
          
          # Get API URL
          cd terraform
          terraform init -input=false > /dev/null
          API_URL=$(terraform output -raw api_gateway_url 2>/dev/null || echo "https://www.${{ env.DOMAIN_NAME }}")
          
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          
          echo "✅ Deployment completed: $DEPLOYMENT_ID"

      - name: 🧪 Post-Deployment Health Check
        id: health_check
        run: |
          echo "🔍 Running health checks against the API Gateway origin..."

          # Gate on the API Gateway invoke URL (origin), not the Cloudflare-fronted
          # domain. Cloudflare WAF/bot-management can return 403 to CI runner IPs,
          # which produced false-negative deploy failures even when the app is healthy.
          ORIGIN_URL="${{ steps.deploy.outputs.api_url }}"
          echo "🌐 Origin: $ORIGIN_URL"

          MAX_RETRIES=5
          RETRY_COUNT=0
          HTTP_STATUS="000"

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ORIGIN_URL/health" || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Origin health check passed (Status: $HTTP_STATUS)"
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Retry $RETRY_COUNT/$MAX_RETRIES (Status: $HTTP_STATUS)"
            sleep 10
          done

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Origin health check failed after $MAX_RETRIES retries"
            exit 1
          fi

          # Test the origin main page (also bypasses Cloudflare)
          MAIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ORIGIN_URL/" || echo "000")
          echo "📄 Origin main page status: $MAIN_STATUS"

          if [ "$MAIN_STATUS" != "200" ]; then
            echo "❌ Origin main page check failed"
            exit 1
          fi

          # Public domain check (through Cloudflare). The probe sends a secret
          # header that a Cloudflare WAF rule (terraform/cloudflare) uses to skip
          # bot management, so a CI runner IP is not falsely blocked. We classify
          # the result: 200 = healthy; 403/429/503 = edge is up but still
          # filtering (warn only); 000 / 5xx / 52x = a real edge or origin
          # failure that must fail the deploy.
          PUBLIC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-ci-probe: ${{ secrets.CF_PROBE_SECRET }}" \
            "https://www.${{ env.DOMAIN_NAME }}/health" || echo "000")

          case "$PUBLIC_STATUS" in
            200)
              echo "✅ Public domain healthy through Cloudflare (Status: $PUBLIC_STATUS)"
              ;;
            403|429|503)
              echo "::warning::Public domain returned $PUBLIC_STATUS via Cloudflare (edge is up but filtering the runner IP; check the CF_PROBE_SECRET WAF rule). Origin is healthy, so the deploy is considered successful."
              ;;
            000|5*)
              echo "❌ Public domain check failed at the Cloudflare edge (Status: $PUBLIC_STATUS): DNS/TLS down or edge cannot reach origin"
              exit 1
              ;;
            *)
              echo "::warning::Public domain returned unexpected status $PUBLIC_STATUS via Cloudflare. Origin is healthy, so the deploy is considered successful."
              ;;
          esac

          echo "✅ All health checks passed!"

      - name: 🔙 Rollback on Failure
        if: failure() && steps.backup.outputs.previous_version != 'NONE'
        run: |
          echo "🔙 Rolling back Lambda to pre-deployment code (version ${{ steps.backup.outputs.previous_version }})"
          if [ -f /tmp/rollback.zip ]; then
            aws lambda update-function-code \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --zip-file fileb:///tmp/rollback.zip \
              --publish
            aws lambda wait function-updated \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }}
            echo "✅ Rollback complete — restored previous Lambda code"
          else
            echo "::error::No rollback artifact available — manual rollback required."
            exit 1
          fi

      - name: 📊 Deployment Summary
        if: success()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment ID | ${{ steps.deploy.outputs.deployment_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ github.event.inputs.environment || 'production' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://www.${{ env.DOMAIN_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${GITHUB_SHA::8} |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Size | ${{ needs.build.outputs.package_size }} |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 7: Smoke Tests
  # ============================================================================
  smoke-tests:
    name: 🔥 Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    if: needs.deploy.result == 'success'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      - name: 🔥 Run Smoke Tests
        env:
          # API Gateway invoke URL (origin) from the deploy job. Hard pass/fail
          # checks run against this origin, so they never depend on Cloudflare
          # bot management or the optional WAF probe-bypass ruleset.
          ORIGIN_URL: ${{ needs.deploy.outputs.api_url }}
          # Public domain (through Cloudflare). Checked for visibility only, as
          # a warning, because CI runner IPs can be bot-challenged at the edge.
          PUBLIC_URL: https://www.${{ env.DOMAIN_NAME }}
          # Optional probe header. When the Cloudflare WAF bypass ruleset is
          # enabled, this lets the runner IP skip bot management; when it is
          # disabled the header is simply ignored.
          PROBE_HEADER: "x-ci-probe: ${{ secrets.CF_PROBE_SECRET }}"
        run: |
          echo "🔥 Running smoke tests..."
          echo "🌐 Origin (hard checks): $ORIGIN_URL"
          echo "🌐 Public (warn-only):   $PUBLIC_URL"
          echo ""

          FAILED=0

          # check_origin <label> <path> <expected_code>
          # Hard pass/fail against the AWS origin. A mismatch fails the job.
          check_origin() {
            local label="$1" path="$2" expected="$3"
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "${ORIGIN_URL}${path}" || echo "000")
            if [ "$code" = "$expected" ]; then
              echo "✅ ${label} OK (Status: $code)"
            else
              echo "::error::${label} failed at origin (expected $expected, got $code) for ${path}"
              FAILED=1
            fi
          }

          # Test 1: Homepage (origin)
          echo "📄 Testing homepage..."
          check_origin "Homepage" "/" "200"

          # Test 2: Health endpoint (origin)
          echo "💚 Testing health endpoint..."
          HEALTH=$(curl -s -m 15 "${ORIGIN_URL}/health" || echo "")
          echo "Health response: $HEALTH"
          check_origin "Health endpoint" "/health" "200"

          # Test 3: Static assets (origin)
          echo "📁 Testing static assets..."
          check_origin "CSS asset" "/css/modern-style.css" "200"
          check_origin "JS asset" "/js/modern-portfolio.js" "200"

          # Test 4: Contact API validation (origin)
          echo "📧 Testing contact API validation..."
          CONTACT_RESPONSE=$(curl -s -X POST "${ORIGIN_URL}/api/contact" \
            -H "Content-Type: application/json" \
            -d '{}' || echo "")
          echo "Contact response: $CONTACT_RESPONSE"
          if echo "$CONTACT_RESPONSE" | grep -qi "error\|fill"; then
            echo "✅ Contact API validation working"
          else
            echo "::warning::Contact API validation response unexpected: $CONTACT_RESPONSE"
          fi

          # Test 5: Response time (origin)
          echo "⏱️ Testing response time..."
          TIME=$(curl -s -o /dev/null -w "%{time_total}" -m 15 "${ORIGIN_URL}/" || echo "99")
          echo "Response time: ${TIME}s"
          if (( $(echo "$TIME > 3" | bc -l) )); then
            echo "::warning::Origin response time is slow: ${TIME}s"
          else
            echo "✅ Response time OK: ${TIME}s"
          fi

          # Test 6: Public domain through Cloudflare (warn-only). The edge can
          # bot-challenge the runner IP (403/429/503); that is not an outage,
          # so it never fails the job. Real edge failures (000 / 5xx) warn too,
          # because the origin checks above are the authoritative gate.
          echo "🌐 Testing public domain via Cloudflare..."
          PUBLIC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 15 \
            -H "$PROBE_HEADER" "${PUBLIC_URL}/health" || echo "000")
          case "$PUBLIC_STATUS" in
            200)
              echo "✅ Public domain healthy through Cloudflare (Status: $PUBLIC_STATUS)"
              ;;
            403|429|503)
              echo "::warning::Public domain returned $PUBLIC_STATUS via Cloudflare (edge up but filtering the runner IP). Origin checks passed, so this is informational."
              ;;
            *)
              echo "::warning::Public domain returned $PUBLIC_STATUS via Cloudflare. Origin checks are authoritative; verify the edge manually if this persists."
              ;;
          esac

          echo ""
          if [ "$FAILED" -ne 0 ]; then
            echo "❌ Smoke tests failed (origin checks did not pass)."
            exit 1
          fi
          echo "🎉 All smoke tests passed!"

      - name: 📊 Test Results
        run: |
          echo "## 🔥 Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Homepage | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Endpoint | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Assets | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Contact API | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Production URL**: https://www.${{ env.DOMAIN_NAME }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 8: Notification
  # ============================================================================
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [deploy, smoke-tests]
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    
    steps:
      - name: 📢 Create Deployment Summary
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ] && [ "${{ needs.smoke-tests.result }}" == "success" ]; then
            STATUS="✅ SUCCESS"
            COLOR="good"
          else
            STATUS="❌ FAILED"
            COLOR="danger"
          fi
          
          echo "## 📢 Deployment Notification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Details**:" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke Tests: ${{ needs.smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Actor: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${GITHUB_SHA::8}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

      # Keyless auth via GitHub OIDC (see terraform/github-oidc/) for the
      # SES notification below.
      - name: 🔑 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-notify-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📧 Send Email Notification via SES
        continue-on-error: true
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ] && [ "${{ needs.smoke-tests.result }}" == "success" ]; then
            SUBJECT="Deployment Successful - ankitraj.cloud"
            STATUS_TEXT="SUCCESS"
          else
            SUBJECT="Deployment Failed - ankitraj.cloud"
            STATUS_TEXT="FAILED"
          fi
          
          # Create JSON message file to avoid shell escaping issues
          cat > /tmp/email-message.json << EOF
          {
            "Subject": {
              "Data": "${SUBJECT}",
              "Charset": "UTF-8"
            },
            "Body": {
              "Html": {
                "Data": "<html><body><h1>Deployment ${STATUS_TEXT}</h1><p><strong>Environment:</strong> Production</p><p><strong>Branch:</strong> ${GITHUB_REF_NAME}</p><p><strong>Commit:</strong> ${GITHUB_SHA::8}</p><p><strong>Actor:</strong> ${GITHUB_ACTOR}</p><p><strong>Deploy:</strong> ${{ needs.deploy.result }}</p><p><strong>Smoke Tests:</strong> ${{ needs.smoke-tests.result }}</p><hr><p><a href='https://www.ankitraj.cloud'>View Site</a> | <a href='https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}'>View Workflow</a></p></body></html>",
                "Charset": "UTF-8"
              }
            }
          }
          EOF
          
          aws ses send-email \
            --from "ci-cd@ankitraj.cloud" \
            --destination "ToAddresses=${{ secrets.NOTIFICATION_EMAIL }}" \
            --message file:///tmp/email-message.json || echo "Email notification skipped (SES not configured or in sandbox)"
          
          echo "📧 Email notification completed!"

  # ============================================================================
  # PR Preview Comment
  # ============================================================================
  pr-summary:
    name: 📝 PR Summary
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, terraform-validate, build]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📝 Create PR Summary Comment
        uses: actions/github-script@v8
        with:
          script: |
            const codeQuality = '${{ needs.code-quality.result }}';
            const security = '${{ needs.security-scan.result }}';
            const terraform = '${{ needs.terraform-validate.result }}';
            const build = '${{ needs.build.result }}';
            
            const getEmoji = (status) => {
              switch(status) {
                case 'success': return '✅';
                case 'failure': return '❌';
                case 'skipped': return '⏭️';
                default: return '⚠️';
              }
            };
            
            const body = `## 🔍 PR Validation Summary
            
            | Stage | Status |
            |-------|--------|
            | Code Quality | ${getEmoji(codeQuality)} ${codeQuality} |
            | Security Scan | ${getEmoji(security)} ${security} |
            | Terraform | ${getEmoji(terraform)} ${terraform} |
            | Build | ${getEmoji(build)} ${build} |
            
            ### 📦 Build Details
            - Package Size: \`${{ needs.build.outputs.package_size || 'N/A' }}\`
            - Build Hash: \`${{ needs.build.outputs.build_hash || 'N/A' }}\`
            
            ---
            *Automated validation by GitHub Actions*
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
