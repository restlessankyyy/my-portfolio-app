name: 📄 Auto-generate Resume PDF

on:
  push:
    paths:
      - 'scripts/resume.html'
      - 'public/img/ankit.png'
    branches: [main]
  workflow_dispatch:          # manual trigger anytime

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Profile.pdf
        run: node scripts/generate-pdf.js

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet public/Profile.pdf && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit & push updated PDF
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Profile.pdf
          git commit -m "chore: auto-regenerate Profile.pdf [skip ci]"
          git push
